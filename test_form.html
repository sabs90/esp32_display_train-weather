<!DOCTYPE HTML>
<html>
<head>
    <title>Prayer Times Settings - Debug Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; margin: 20px; background: #f0f0f0; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        input[type="checkbox"] { width: auto; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #45a049; }
        .debug-output { background: #f8f9fa; border: 1px solid #dee2e6; padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Debug Test Form</h2>
        <p>This form will test the WiFi settings submission with detailed debug output.</p>
        
        <form id="settingsForm">
            <div class="field">
                <label for="ssid">WiFi Network Name:</label>
                <input type="text" id="ssid" value="TestNetwork" required>
            </div>
            <div class="field">
                <label for="password">WiFi Password:</label>
                <input type="password" id="password" value="testpassword123">
            </div>
            <div class="field">
                <label for="latitude">Latitude:</label>
                <input type="number" id="latitude" step="0.0001" value="-33.8688" required>
            </div>
            <div class="field">
                <label for="longitude">Longitude:</label>
                <input type="number" id="longitude" step="0.0001" value="151.2093" required>
            </div>

            <button type="submit">Test Submit</button>
        </form>

        <div id="debugOutput" class="debug-output">
            Debug output will appear here...
        </div>
    </div>

    <script>
        function addDebug(message) {
            const debugDiv = document.getElementById('debugOutput');
            const timestamp = new Date().toISOString();
            debugDiv.innerHTML += `[${timestamp}] ${message}\n`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        // Form submission with enhanced debugging
        document.getElementById('settingsForm').onsubmit = function(e) {
            e.preventDefault();
            
            addDebug('Form submission started');
            
            // Clear previous output
            document.getElementById('debugOutput').innerHTML = '';
            addDebug('Form submission initiated');
            
            // Gather form data
            const formData = {
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                calculationMethod: 3,
                school: 1,
                devModeEnabled: false,
                overrideMode: 0,
                ssid: document.getElementById('ssid').value,
                password: document.getElementById('password').value
            };
            
            addDebug('Form data prepared: ' + JSON.stringify(formData, null, 2));
            
            // Check the current URL and adjust target
            const targetUrl = window.location.hostname === '192.168.4.1' ? 
                             'http://192.168.4.1/settings' : 
                             '/settings';
            
            addDebug('Target URL: ' + targetUrl);
            addDebug('Current location: ' + window.location.href);
            
            // Send request with enhanced debugging
            addDebug('Sending fetch request...');
            
            fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                addDebug('Response received - Status: ' + response.status);
                addDebug('Response status text: ' + response.statusText);
                addDebug('Response headers: ' + JSON.stringify(Object.fromEntries(response.headers.entries())));
                
                if (response.ok) {
                    return response.text();
                } else {
                    throw new Error('Server responded with status: ' + response.status + ' - ' + response.statusText);
                }
            })
            .then(data => {
                addDebug('SUCCESS: Response data received');
                addDebug('Response body: ' + data);
                
                if (formData.ssid && formData.ssid.length > 0) {
                    addDebug('WiFi settings submitted - device should restart soon');
                }
            })
            .catch(error => {
                addDebug('ERROR: ' + error.message);
                addDebug('Full error: ' + JSON.stringify(error));
                console.error('Error details:', error);
            });
            
            return false;
        };
        
        addDebug('Test form loaded and ready');
        addDebug('Current URL: ' + window.location.href);
    </script>
</body>
</html>
